[project]
name = "hgnc_gene_app"
version = "0.1.0"
description = "Flask web app to search gene information from HGNC data"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hgnc_gene_app*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"